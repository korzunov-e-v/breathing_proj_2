main-menu:
    menu:
        text: |
            🧘 *Ваше пространство для дыхания*
            
            Здесь вы найдете практики, которые помогут обрести гармонию и спокойствие.
        media:
            - AgACAgIAAxkBAAIFPGksUH2iD8YETWJR6ohqgFWItyikAAI0DWsbwj5oSeqRrcBf8bH-AQADAgADeAADNgQ
        buttons:
            - { text: "🧘 Практика дня", goto: daily_practice }
            - { text: "🔄 Пройти снова", goto: practice_again }
            - { text: "📚 Библиотека", goto: library }
            - { text: "📊 Дневник эмоций", goto: emotion_diary }
            - { text: "📈 Аналитика", goto: analytics }
            - { text: "⚙️ Настройки", goto: settings }

    emotion_diary:
        text: |
            📖 *Дневник эмоций*
            
            Отслеживание эмоций помогает:
            • Лучше понимать себя
            • Замечать паттерны настроения
            • Управлять стрессом
            • Развивать эмоциональный интеллект
            
            Записывайте эмоции в течение дня, и я помогу вам их проанализировать!
        buttons:
            -   text: "📝 Записать эмоцию сейчас"
                goto: "custom_emotion"
            -   text: "📊 Моя статистика"
                goto: "emotion_stats"
            -   text: "📈 График эмоций"
                goto: "emotion_chart"
            -   text: "📁 Экспорт данных"
                goto: "export_emotions"
            -   text: "⬅️ Назад"
                goto: "menu"
    library:
        text: "📚 *Библиотека знаний*"
        buttons:
            - { text: "📖 Статьи", goto: articles }
            - { text: "🎵 Музыка", goto: music }
            - { text: "💝 Избранное", goto: favorites }
            - { text: "⬅️ Назад", goto: menu }

    practice_again:
        text: |
            🔄 *Повторить практики*
            
            Здесь вы можете повторить уже пройденные практики.
        buttons:
            - { text: "⬅️ Назад", goto: menu }

    all_practices:
        text: "📋 *Все практики*"
        buttons:
            - { text: "⬅️ Назад", goto: practice_again }

    articles:
        text: "Статьи о дыхании и медитации"
        buttons:
            - { text: "⬅️ Назад", goto: library }

    music:
        text: "Музыка для релаксации"
        buttons:
            - { text: "⬅️ Назад", goto: library }

    favorites:
        text: "Ваши сохраненные материалы"
        buttons:
            - { text: "⬅️ Назад", goto: library }

    analytics:
        text: "Ваша статистика и прогресс"
        buttons:
            - { text: "⬅️ Назад", goto: menu }

    settings:
        text: "Настройки"
        buttons:
            - { text: "🕐 Изменить время практик", goto: change_time }
            - { text: "⬅️ Назад", goto: menu }

    change_time:
        text: "Выберите удобное время для практик:"
        buttons:
            - { text: "07:00", goto: set_time_07:00 }
            - { text: "08:00", goto: set_time_08:00 }
            - { text: "09:00", goto: set_time_09:00 }
            - { text: "10:00", goto: set_time_10:00 }
            - { text: "11:00", goto: set_time_11:00 }
            - { text: "12:00", goto: set_time_12:00 }
            - { text: "⬅️ Назад", goto: settings }
