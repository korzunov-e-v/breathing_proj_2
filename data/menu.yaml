main-menu:
    menu:
        text: |
            🧘 *Ваше пространство для дыхания*
            
            Здесь вы найдете практики, которые помогут обрести гармонию и спокойствие.
        buttons:
            - { text: "🧘 Практика дня", goto: daily_practice }
            - { text: "📚 Библиотека", goto: library }
            - { text: "📊 Дневник эмоций", goto: emotion_diary }
            - { text: "📈 Аналитика", goto: analytics }
            - { text: "⚙️ Настройки", goto: settings }

    practice_complete:
        text: "Отлично! Практика завершена. Как ваше состояние?"
        buttons:
            - { text: "😊 Хорошо", goto: reflection_good }
            - { text: "😌 Спокойно", goto: reflection_calm }
            - { text: "😰 Тревожно", goto: reflection_anxious }
            - { text: "🙀 Волнительно", goto: reflection_excited }

    practice_reflection_good:
        text: "Рад слышать! Продолжайте в том же духе."
        buttons:
            - { text: "⬅️ В главное меню", goto: menu }

    practice_reflection_calm:
        text: "Прекрасно. Спокойствие - это сила."
        buttons:
            - { text: "⬅️ В главное меню", goto: menu }

    practice_reflection_anxious:
        text: "Спасибо за честность. Практика поможет снизить тревогу."
        buttons:
            - { text: "⬅️ В главное меню", goto: menu }

    practice_reflection_excited:
        text: "Энтузиазм - это прекрасно! Направьте эту энергию в практику."
        buttons:
            - { text: "⬅️ В главное меню", goto: menu }

    library:
        text: "📚 *Библиотека знаний*"
        buttons:
            - { text: "📖 Статьи", goto: articles }
            - { text: "🎵 Музыка", goto: music }
            - { text: "💝 Избранное", goto: favorites }
            - { text: "⬅️ Назад", goto: menu }

    articles:
        text: "Статьи о дыхании и медитации"
        buttons:
            - { text: "⬅️ Назад", goto: library }

    music:
        text: "Музыка для релаксации"
        buttons:
            - { text: "⬅️ Назад", goto: library }

    favorites:
        text: "Ваши сохраненные материалы"
        buttons:
            - { text: "⬅️ Назад", goto: library }

    emotion_diary:
        text: "Дневник эмоций"
        buttons:
            - { text: "⬅️ Назад", goto: menu }

    analytics:
        text: "Ваша статистика и прогресс"
        buttons:
            - { text: "⬅️ Назад", goto: menu }

    settings:
        text: "Настройки"
        buttons:
            - { text: "🕐 Изменить время практик", goto: change_time }
            - { text: "⬅️ Назад", goto: menu }

    change_time:
        text: "Выберите удобное время для практик:"
        buttons:
            - { text: "07:00", goto: set_time_07:00 }
            - { text: "08:00", goto: set_time_08:00 }
            - { text: "09:00", goto: set_time_09:00 }
            - { text: "10:00", goto: set_time_10:00 }
            - { text: "⬅️ Назад", goto: settings }