services:
    bot:
        build:
            context: .
        container_name: breathing-bot
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - .env.docker
        volumes:
            - ./logs:/app/logs
            - ./data:/app/data
            - ./admin:/app/admin
            - ./alembic:/app/alembic
            - ./src:/app/src
        restart: unless-stopped
        command: ["python", "src/main.py"]

    # Админ-панель
    admin:
        build:
            context: .
        container_name: breathing-admin
        depends_on:
            - postgres
        volumes:
            - ./admin:/app/admin
            - ./src:/app/src
        env_file:
            - .env.docker
        environment:
            POSTGRES_DB: breathing_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            FLASK_APP: admin.admin_app
            FLASK_ENV: production
            SECRET_KEY: ${ADMIN_SECRET_KEY:-change-this-in-production}
        ports:
            - "127.0.0.1:5001:5001"
        restart: unless-stopped
        command: ["python", "admin/run_admin.py"]

    postgres:
        image: postgres:16
        container_name: postgres
        environment:
            - TZ=Etc/UTC
        ports:
            - "127.0.0.1:15432:5432"
        env_file:
            - .env.docker
        volumes:
            - ./pg_data:/var/lib/postgresql/data
        #        networks:
        #            - net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
#        extra_hosts:
#            - "host.docker.internal:172.18.0.1"
